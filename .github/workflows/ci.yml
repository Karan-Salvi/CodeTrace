# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codetrace
          POSTGRES_PASSWORD: codetrace_ci_password
          POSTGRES_DB: codetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codetrace -d codetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://codetrace:codetrace_ci_password@localhost:5432/codetrace_test
      REDIS_URL: redis://localhost:6379/1
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-dummy-access-secret-not-real-0000000000
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret-not-real-0000000000
      TOKEN_ENCRYPTION_KEY: ci-dummy-encryption-key-32-chars-min
      INTERNAL_API_SECRET: ci-dummy-internal-secret-16-chars-min
      GITHUB_CLIENT_ID: ci-dummy-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-client-secret
      GITHUB_APP_ID: "000000"
      GITHUB_APP_SLUG: ci-dummy-app-slug
      # A real (but throwaway, CI-only) RSA keypair — not the fake text
      # placeholder this used to be. jsonwebtoken's RS256 signer parses the
      # PEM structurally before it ever gets to signing, so a syntactically
      # invalid "key" throws "secretOrPrivateKey must be an asymmetric key"
      # for every test that exercises signAppJwt (github-app.service.ts),
      # even though nothing here talks to a real GitHub App.
      GITHUB_APP_PRIVATE_KEY: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIEpQIBAAKCAQEAvv1XvqXKJ6N2jH11Q86CzS0nNwxQaNnFZLCWv4OKRrxa0NUk
