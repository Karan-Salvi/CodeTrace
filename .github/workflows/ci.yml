# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codetrace
          POSTGRES_PASSWORD: codetrace_ci_password
          POSTGRES_DB: codetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codetrace -d codetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://codetrace:codetrace_ci_password@localhost:5432/codetrace_test
      REDIS_URL: redis://localhost:6379/1
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-dummy-access-secret-not-real-0000000000
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret-not-real-0000000000
      TOKEN_ENCRYPTION_KEY: ci-dummy-encryption-key-32-chars-min
      INTERNAL_API_SECRET: ci-dummy-internal-secret-16-chars-min
      GITHUB_CLIENT_ID: ci-dummy-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-client-secret
      GITHUB_APP_ID: "000000"
      GITHUB_APP_SLUG: ci-dummy-app-slug
      # GITHUB_APP_PRIVATE_KEY is deliberately NOT set here as a literal —
      # see the "Generate throwaway GitHub App key" step below. A static
      # "-----BEGIN RSA PRIVATE KEY-----" block committed in this file
      # trips secret scanners (GitHub push protection, gitleaks, etc.) even
      # though it's fake, and sits in git history forever for no reason —
      # generating a fresh one at job runtime avoids both.
      GITHUB_WEBHOOK_SECRET: ci-dummy-webhook-secret
      JINA_API_KEY: ci-dummy-jina-key
      EMBEDDING_MODEL_VERSION: gemini-embedding-001-1536
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # gemini-2.5-flash was deprecated ("no longer available to new
      # users") — env.ts's default still points at it for existing prod
      # keys where it may still work, but this CI key gets a hard 404 on
      # it, so override explicitly here.
      GEMINI_CHAT_MODEL: gemini-3.6-flash

    steps:
      - uses: actions/checkout@v4

      # jsonwebtoken's RS256 signer (github-app.service.ts's signAppJwt)
      # parses its key as real PEM before it ever gets to signing — a fake
      # string there throws "secretOrPrivateKey must be an asymmetric key"
      # for any test that exercises it. Needs *a* structurally valid RSA
      # key, not *this* one, so generate a fresh throwaway one per run
      # instead of committing a static PEM block (trips secret scanners,
      # sits in git history forever, and nothing here ever talks to a real
      # GitHub App anyway).
      - name: Generate throwaway GitHub App key
        run: |
          {
            echo "GITHUB_APP_PRIVATE_KEY<<CI_KEY_EOF"
            openssl genrsa -traditional 2048 2>/dev/null
            echo "CI_KEY_EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Prisma 7 dropped the postinstall auto-generate — @prisma/client
      # ships with no generated code until this runs explicitly, which
      # every backend test importing prisma/client.js needs.
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Create test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=codetrace_ci_password psql -h localhost -U codetrace -d codetrace \
            -c "CREATE DATABASE codetrace_test"

      - name: Build shared/types
        run: npm run build --workspace=shared/types

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      # Two-pass deploy: the CONCURRENTLY migrations (fts_split_*) can't run
      # inside a transaction — Postgres enforces this unconditionally, and
      # this reliably fails against the real production image (confirmed
      # with a real `docker run` — see
      # backend/scripts/apply-concurrent-migrations.ts's header comment).
      # continue-on-error lets the job proceed to the manual-apply step
      # instead of stopping here. If migrations 1-5 fail for an unrelated
      # reason, the next step (which needs the base schema already in
      # place) fails for real and stops the job anyway.
      - name: Run backend migrations (initial pass)
        working-directory: backend
        run: npx prisma migrate deploy
        continue-on-error: true

      - name: Apply CONCURRENTLY index migrations
        working-directory: backend
        run: npx tsx scripts/apply-concurrent-migrations.ts

      # Real gate: everything should now be either applied or resolved: if
      # anything is still wrong, this fails the build for real.
      - name: Run backend migrations (final)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Backend test suite
        run: npm test --workspace=backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation harness dependencies
        run: pip install -r evaluation/requirements.txt

      - name: Start backend for eval seeding
        working-directory: backend
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/health

      - name: Seed evaluation fixture
        working-directory: backend
        run: npx tsx scripts/seed-eval-fixture.ts

      - name: Retrieval evaluation smoke
        run: python evaluation/runner/retrieval_eval.py --config hybrid

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codetrace
          POSTGRES_PASSWORD: codetrace_ci_password
          POSTGRES_DB: codetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codetrace -d codetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://codetrace:codetrace_ci_password@localhost:5432/codetrace_test
      REDIS_URL: redis://localhost:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      INTERNAL_API_SECRET: ci-dummy-internal-secret-16-chars-min
      # Real key, not a dummy — tests/embedding/test_embedder.py's
      # @requires_gemini_key tests call the real embedding API.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMBEDDING_MODEL_VERSION: gemini-embedding-001-1536

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: worker
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Create test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=codetrace_ci_password psql -h localhost -U codetrace -d codetrace \
            -c "CREATE DATABASE codetrace_test"

      # Schema is backend-owned (CLAUDE.md: worker only reads/writes, never
      # migrates) — but worker's own tests hit real tables (repositories,
      # users, chunks) against this same codetrace_test database, so the
      # backend's migrations still need to run here once, same two-pass
      # approach as the js job (CONCURRENTLY migrations can't run inside
      # Prisma's transaction).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run backend migrations (initial pass)
        working-directory: backend
        run: npx prisma migrate deploy
        continue-on-error: true

      - name: Apply CONCURRENTLY index migrations
        working-directory: backend
        run: npx tsx scripts/apply-concurrent-migrations.ts

      - name: Run backend migrations (final)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Lint (ruff)
        working-directory: worker
        run: ruff check .

      - name: Typecheck (mypy)
        working-directory: worker
        run: mypy src

      - name: Test
        working-directory: worker
        run: pytest

  # CD, in the same pipeline as CI rather than a separate workflow_run-linked
  # file — one run shows lint/test/deploy together instead of two opaque
  # linked runs. `needs: [js, worker]` gates this on BOTH CI jobs actually
  # succeeding; the `if` restricts it to real pushes to main (never PRs,
  # and never re-runs on a PR's own push event).
  #
  # SSHes into the already-provisioned VM (Docker + git + gettext-base +
  # cron + openssl already installed, per docs/deployment.md) and runs the
  # idempotent redeploy sequence — clones the repo to DEPLOY_PATH if it's
  # not there yet, git reset to origin/main, rebuild the services that
  # changed, run migrations (scripts/migrate.sh, safe to run every time —
  # a no-op when nothing's pending), then a real health check as the
  # actual pass/fail gate, not just "docker started".
  #
  # Deliberately does NOT auto-run TLS bootstrap (scripts/init-tls.sh /
  # render-nginx-config.sh) even on a fresh clone: cert issuance needs
  # port 80 free with nginx NOT running, needs DNS already resolving, and
  # hits Let's Encrypt's real rate-limited servers — unsafe to retry
  # automatically from a push-triggered job. A genuinely fresh VM (no
  # codetrace_certbot_certs volume yet) gets everything except nginx
  # started and migrated, then this job stops with instructions instead of
  # blind-starting nginx (which would just crash — its config needs cert
  # files that don't exist yet).
  #
  # Required repo configuration (Settings -> Secrets and variables ->
  # Actions), none of which exist yet — this job cannot run until they're
  # added:
  #   Secrets:
  #     DEPLOY_HOST       - VM's public IP or hostname
  #     DEPLOY_USER       - SSH user on the VM
  #     DEPLOY_SSH_KEY    - private key for that user (matching public key
  #                         in the VM's ~/.ssh/authorized_keys)
  #   Variables:
  #     DEPLOY_PATH       - absolute path where the repo should live on
  #                         the VM (e.g. /home/deploy/CodeTrace) — cloned
  #                         automatically here if not already present
  #     DEPLOY_DOMAIN     - the real domain (e.g. codetrace.example.com),
  #                         used only for the post-deploy health check
  deploy:
    needs: [js, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            if [ ! -d "${{ vars.DEPLOY_PATH }}/.git" ]; then
              echo "==> No clone at ${{ vars.DEPLOY_PATH }} yet — cloning..."
              # SSH URL, not HTTPS: works identically whether the repo is
              # public or private, via a read-only deploy key already
              # installed on the VM (docs/deployment.md) — GITHUB_TOKEN
              # would expire when this job ends and get baked into
              # .git/config, breaking every future `git fetch` after this
              # one run, so it's deliberately not used here.
              git clone git@github.com:${{ github.repository }}.git "${{ vars.DEPLOY_PATH }}"
            fi
            cd "${{ vars.DEPLOY_PATH }}"

            echo "==> Pulling latest main..."
            git fetch origin main
            git reset --hard origin/main

            # TLS cert issuance (scripts/init-tls.sh) can't be safely
            # automated here: it needs port 80 free with nginx NOT running,
            # needs DNS already resolving, and hits Let's Encrypt's real
            # (rate-limited) servers — a bad automated retry here can get
            # the domain temporarily blocked. So a genuinely fresh VM (no
            # cert volume yet) gets everything EXCEPT nginx started and
            # migrated, then this job stops with clear instructions —
            # never blind-starts nginx, which would just crash anyway
            # (its config requires cert files that don't exist yet).
            if ! docker volume inspect codetrace_certbot_certs >/dev/null 2>&1; then
              echo "==> First deploy on this VM: no TLS cert volume yet."
              echo "==> Starting everything except nginx, running migrations, then stopping here."
              docker compose --env-file infra/env/.env.docker -f infra/docker-compose.single-vm.yml up -d --build postgres redis backend worker frontend
              bash scripts/migrate.sh
              echo "==> Now run manually, once, before this pipeline can go further:"
              echo "    DOMAIN=${{ vars.DEPLOY_DOMAIN }} EMAIL=you@example.com ./scripts/init-tls.sh"
              echo "    DOMAIN=${{ vars.DEPLOY_DOMAIN }} ./scripts/render-nginx-config.sh"
              echo "    docker compose --env-file infra/env/.env.docker -f infra/docker-compose.single-vm.yml up -d nginx"
              exit 1
            fi

            echo "==> Rebuilding and restarting changed services..."
            docker compose --env-file infra/env/.env.docker -f infra/docker-compose.single-vm.yml up -d --build

            echo "==> Running migrations..."
            bash scripts/migrate.sh

            echo "==> Health check..."
            for i in $(seq 1 30); do
              if curl -sf "https://${{ vars.DEPLOY_DOMAIN }}/health"; then
                echo "==> Deploy successful."
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after deploy" >&2
            exit 1
