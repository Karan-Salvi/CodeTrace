server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is the SPA entry point and must always be revalidated —
    # it's what references the current build's hashed JS/CSS filenames.
    # Plain nginx sends no explicit Cache-Control by default (only ETag/
    # Last-Modified), which lets browsers apply their own heuristic
    # caching to it same as any other static file. That let a normal
    # reload after a new deploy keep serving a stale cached index.html
    # (and therefore a stale bundle reference) until a hard reload
    # (Ctrl+Shift+R) forced a real re-fetch — confirmed as the actual
    # cause of this session's "works on hard reload, not normal reload"
    # bug.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite's hashed asset filenames (main.[hash].js etc.) change whenever
    # their content does, so caching them forever is always safe and
    # never causes stale-content bugs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
