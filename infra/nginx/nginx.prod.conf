events {}

http {
  upstream frontend_upstream {
    server frontend:80;
  }

  upstream backend_upstream {
    server backend:3000;
  }

  server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt HTTP-01 challenge — served for both the initial
    # standalone issuance (scripts/init-tls.sh, nginx not running yet)
    # and later webroot renewals (scripts/renew-tls.sh, nginx running).
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Webhook payloads (GitHub push/PR events) can be larger than
    # nginx's 1m default.
    client_max_body_size 5m;

    location /ws {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Exact match wins over the regex location below regardless of file
    # order (nginx: exact match > longest prefix > first-matching regex).
    # /auth/success is a FRONTEND page (post-login landing route,
    # frontend/src/App.tsx) that the backend redirects the browser to
    # after GitHub OAuth (auth.controller.ts) — it collides with the
    # backend-routing regex's "auth" prefix otherwise, 404ing since the
    # backend has no such route (only /auth/github, /auth/refresh, etc).
    location = /auth/success {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
    }

    # Always backend, regardless of Accept header — unlike every other
    # /repositories* path, this one IS hit by a real top-level browser
    # navigation (GitHub redirects here after install approval, sending
    # "Accept: text/html,..." same as any page load) but must still reach
    # the backend to create the RepositoryInstallation row before it
    # issues its own redirect to /install-complete. The Accept-based
    # branch below would otherwise misroute it to the frontend.
    location = /repositories/installation-callback {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|health|evaluation|webhooks) {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /repositories* and /usage are each BOTH a real frontend SPA page
    # (frontend/src/App.tsx: /repositories, /repositories/new,
    # /repositories/:id and its chat/pull-requests/architecture children,
    # /usage) AND a real backend JSON API under the same prefix
    # (repositories.routes.ts, usage.routes.ts) — path alone can't tell
    # these apart. A real browser navigation/refresh sends
    # "Accept: text/html,...", which api-client.ts's fetch() calls never
    # do (default "*/*") — branch on that instead. Without this, a page
    # refresh on e.g. /repositories/:id 404'd ("Cannot GET") since the
    # backend has no matching route, and /repositories itself worse-cased
    # into a raw 401 JSON body (GET /repositories IS a real, bearer-gated
    # backend route) instead of ever reaching the SPA.
    location ~ ^/(repositories|usage) {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      if ($http_accept ~* "text/html") {
        proxy_pass http://frontend_upstream;
        break;
      }

      proxy_pass http://backend_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
    }
  }
}
