# Explicit project name — see docker-compose.single-vm.yml's comment:
# without this, the default directory-based project name ("infra")
# collides with docker-compose.dev.yml's containers/volumes.
name: codetrace-backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: codetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codetrace
    volumes:
      - codetrace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrace -d codetrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - codetrace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - env/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.rendered.conf:/etc/nginx/nginx.conf:ro
      - codetrace_certbot_certs:/etc/letsencrypt:ro
      - codetrace_certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  codetrace_postgres_data:
  codetrace_redis_data:
  codetrace_certbot_certs:
    external: true
  codetrace_certbot_webroot:
    external: true
